apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.shanivar.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.shanivar.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0-shell"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    // implementation project(':capacitor-android')          // added by `cap sync`
    // implementation project(':capacitor-cordova-android-plugins') // added by `cap sync`
}
