android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
org.gradle.workers.max=2
# Points at the deployed backend, so a test device needs nothing but internet — no shared
# Wi-Fi, no server running on anyone's laptop. Emulator use stays permanently banned on the
# dev machine (it crashed the machine once), so a physical device is the only verification path.
# Note for testers: the backend is on Render's free tier and spins down when idle, so the first
# request after a quiet period takes ~20-30s to wake. That is a cold start, not a hang.
# To point at a local backend instead, override per-build:
#   ./gradlew.bat assembleDebug -PshanivarApiUrl=http://<your-LAN-IP>:5000/api
shanivarApiUrl=https://hybridmonk-api.onrender.com/api
