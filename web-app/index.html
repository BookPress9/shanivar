<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11140f">
  <meta name="description" content="Shanivar: a local-first Routine and Sadhana practice application.">
  <meta name="robots" content="noindex,nofollow">
  <title>Shanivar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <a class="skip" href="#app-main">Skip to content</a>
  <div id="offline-banner" class="banner" hidden>You are offline. Changes stay on this device and will sync when the connection returns.</div>
  <header class="topbar">
    <button class="wordmark" data-go="home" aria-label="Shanivar home"><span>SHANIVAR</span><small>practice · routine</small></button>
    <button id="sync-pill" class="sync-pill" data-go="settings" aria-label="Open account and sync settings">Local</button>
  </header>
  <main id="app-main" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Primary">
    <button data-tab="home"><span aria-hidden="true">◯</span>Today</button>
    <button data-tab="routine"><span aria-hidden="true">☷</span>Routine</button>
    <button data-tab="sadhana"><span aria-hidden="true">◇</span>Sadhana</button>
    <button data-tab="records"><span aria-hidden="true">···</span>Record</button>
    <button data-tab="settings"><span aria-hidden="true">⚙</span>Settings</button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script><script src="content.js"></script><script src="logic.js"></script><script src="sync.js"></script><script src="app.js"></script>
</body>
</html>
