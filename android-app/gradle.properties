android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
org.gradle.workers.max=2
# Emulator use is permanently banned on the dev machine (crashed it once), so the only real
# verification path is a physical device on the same Wi-Fi as the machine running `npm start`
# in backend/ - this must be the dev machine's current LAN IPv4, not 10.0.2.2 (that only resolves
# inside an emulator). Re-run `ipconfig`/`Get-NetIPAddress` if the machine's IP changes networks.
# For remote/off-network testing, swap this for a tunnel URL (e.g. ngrok) instead.
shanivarApiUrl=http://192.168.1.11:5000/api
